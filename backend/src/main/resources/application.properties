# =====================================================================
#  Training Management System - backend configuration
# =====================================================================

# ---------------------------------------------------------------------
#  MySQL connection (JDBC)
#
#  >>> PUT YOUR MYSQL PASSWORD HERE <<<
#  Replace YOUR_PASSWORD on the "password" line below with your MySQL
#  password, e.g.   ${DB_PASSWORD:mySecret123}
#  (If your MySQL user is not root, change root on the username line.)
#
#  Alternatively leave this file unchanged and create backend/.env
#  from backend/.env.example - values there take priority.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/training_management_system?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional: read DB_URL / DB_USERNAME / DB_PASSWORD from backend/.env
spring.config.import=optional:file:.env[.properties]

# HikariCP connection pool (used by JdbcTemplate)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

# Never run SQL scripts automatically: your existing database is not touched.
spring.sql.init.mode=never

# ---------------------------------------------------------------------
#  Web server
# ---------------------------------------------------------------------
server.port=8080

# Frontend origins allowed to call this API (comma separated)
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Never send Java stack traces to the browser
server.error.include-stacktrace=never
server.error.include-message=always

# Log the SQL executed by JdbcTemplate (useful during a demo; set to INFO to hide)
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.com.trainingmanagement=INFO
