# =====================================================================
#  PRODUCTION settings - used only when SPRING_PROFILES_ACTIVE=prod
#  (set by the Dockerfile). Your local setup is not affected.
#
#  Every secret comes from environment variables set in the hosting
#  dashboard. Nothing secret is written in this file.
# =====================================================================

# Database: no defaults on purpose - the app refuses to start without them.
# Example DB_URL for a hosted MySQL that requires an encrypted connection:
#   jdbc:mysql://HOST:PORT/training_management_system?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hosting platforms tell the app which port to use
server.port=${PORT:8080}

# The host terminates HTTPS in front of the app; trust its X-Forwarded-* headers
server.forward-headers-strategy=framework

# Login session cookie: only over HTTPS, not readable by JavaScript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m

# The React app is served by Spring Boot from the same address, so no
# other website is allowed to call the API.
app.cors.allowed-origins=${APP_ORIGIN:https://localhost.invalid}

# Do not reveal the MySQL version on /api/health
app.health.show-details=false

# No SQL statements in the logs
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO

server.error.include-message=never
